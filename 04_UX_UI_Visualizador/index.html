<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMENA · Visualizador Digital v3</title>
    <style>
        :root {
            --amena-navy: #254F66;
            --amena-blue: #254F66;
            --amena-house: #254F66;
            --amena-house-strong: #1E475C;
            --amena-house-soft: #B7C9C4;
            --amena-apartment: #D8862E;
            --amena-apartment-strong: #C97824;
            --amena-apartment-soft: #DDD5C9;
            --amena-stone: #B4ADA4;
            --amena-stone-2: #E6E0D7;
            --amena-header: #ADA7A1;
            --amena-surface: #FAF7F1;
            --amena-bg: #F0ECE5;
            --amena-panel: #B7C8C3;
            --amena-panel-soft: #EDF2EF;
            --amena-text: #2F3746;
            --amena-muted: #667085;
            --amena-border: #D5D6D8;
            --amena-success: #2CAB5F;
            --amena-warning: #D9A728;
            --amena-orange: #D7872E;
            --shadow-soft: 0 14px 38px rgba(17, 31, 57, 0.08);
            --shadow-press: 0 10px 24px rgba(35, 79, 102, 0.18);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 18px;
            --radius-sm: 14px;
            --transition: 240ms cubic-bezier(.2, .8, .2, 1);
            --max-app: 460px;
            --flow-accent: var(--amena-apartment);
            --flow-accent-strong: var(--amena-apartment-strong);
            --flow-accent-soft: var(--amena-stone-2);
            --flow-button: var(--amena-apartment-strong);
            --flow-button-hover: #7C7267;
            --flow-button-shadow: rgba(110, 98, 84, .26);
        }

        body.theme-apartments {
            --flow-accent: var(--amena-apartment);
            --flow-accent-strong: var(--amena-apartment-strong);
            --flow-accent-soft: #EEE3D6;
            --flow-button: var(--amena-apartment);
            --flow-button-hover: #C9771D;
            --flow-button-shadow: rgba(215, 135, 46, .28);
        }

        body.theme-houses {
            --flow-accent: var(--amena-house);
            --flow-accent-strong: var(--amena-house-strong);
            --flow-accent-soft: var(--amena-house-soft);
            --flow-button: var(--amena-house);
            --flow-button-hover: var(--amena-house-strong);
            --flow-button-shadow: rgba(35, 79, 102, .26);
        }


        body.theme-apartments .step-chip {
            color: var(--amena-apartment-strong);
            border-color: color-mix(in srgb, var(--amena-apartment) 28%, white);
        }

        body.theme-houses .step-chip {
            color: var(--amena-house-strong);
            border-color: color-mix(in srgb, var(--amena-house-strong) 18%, white);
        }

        body.theme-apartments .progress-fill {
            background: linear-gradient(90deg, #B97A31 0%, var(--amena-apartment) 62%, #EDB36F 100%);
            background-size: 180% 100%;
        }

        body.theme-houses .progress-fill {
            background: linear-gradient(90deg, var(--amena-house) 0%, #2C6D86 62%, #65A7B8 100%);
            background-size: 180% 100%;
        }

        body.theme-apartments .headline,
        body.theme-apartments .card-title,
        body.theme-apartments .section-kicker {
            color: #B66F20;
        }

        body.theme-apartments .summary-box {
            background: linear-gradient(180deg, #FFF9F2 0%, #F8EBDD 100%);
            border-color: color-mix(in srgb, var(--amena-apartment) 42%, white);
            box-shadow: 0 16px 34px rgba(215, 135, 46, .14);
        }

        body.theme-apartments .selection-shell {
            background: linear-gradient(180deg, #FCF7F0 0%, #F6EBDD 100%);
            border-color: color-mix(in srgb, var(--amena-apartment) 40%, white);
            box-shadow: 0 16px 34px rgba(215, 135, 46, .12);
        }

        body.theme-apartments .inline-link {
            border-color: color-mix(in srgb, var(--amena-apartment) 38%, white);
            background: linear-gradient(180deg, #FFF9F3 0%, #F7ECDF 100%);
        }

        body.theme-apartments .inline-link:hover,
        body.theme-apartments .inline-link:focus-visible {
            background: #FFF6EC;
            border-color: var(--amena-apartment);
            box-shadow: 0 14px 30px rgba(215, 135, 46, .14);
        }

        body.theme-apartments .inline-link span:last-child {
            color: var(--amena-apartment-strong);
        }

        body.theme-apartments .card.interactive:hover,
        body.theme-apartments .card.interactive:focus-visible {
            border-color: var(--amena-apartment);
            box-shadow: 0 24px 42px rgba(215, 135, 46, .16);
        }

        body.theme-apartments .card.selected {
            border-color: var(--amena-apartment);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--amena-apartment) 28%, transparent), 0 18px 38px rgba(215, 135, 46, .18);
            background: linear-gradient(180deg, #FFF9F2 0%, #F6E7D7 100%);
        }

        body.theme-apartments .btn-secondary {
            border-color: color-mix(in srgb, var(--amena-apartment) 36%, white);
            background: linear-gradient(180deg, #FFF9F3 0%, #F7ECDF 100%);
            color: #A5651E;
        }

        body.theme-apartments .btn-secondary:hover,
        body.theme-apartments .btn-secondary:focus-visible {
            border-color: var(--amena-apartment);
            background: linear-gradient(180deg, #FFF6EC 0%, #F5E3CF 100%);
        }

        body.theme-apartments .step-chip {
            background: #FFF7ED;
            color: var(--amena-apartment-strong);
            border-color: color-mix(in srgb, var(--amena-apartment) 42%, white);
            box-shadow: 0 10px 18px rgba(215, 135, 46, .10);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #efebe4 0%, #e7e1d8 100%);
            color: var(--amena-text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        a {
            color: inherit;
        }

        .app-shell {
            min-height: 100vh;
            padding: 16px 12px 30px;
        }

        .phone-frame {
            max-width: var(--max-app);
            margin: 0 auto;
            background: linear-gradient(180deg, #f7f4ee 0%, #f1ece4 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 48px rgba(31, 46, 74, 0.09);
            border-radius: 34px;
            overflow: hidden;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: #ADA7A1;
            border-bottom: 1px solid rgba(255, 255, 255, .16);
            padding: 20px 20px 14px;
        }

        .topbar-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            color: #254F66;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #254F66;
            text-transform: uppercase;
            line-height: 1;
            white-space: nowrap;
        }

        .brand-sub {
            margin-top: 4px;
            color: #254F66;
            opacity: 0.8;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .28em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .step-chip {
            flex-shrink: 0;
            padding: 11px 14px;
            background: rgba(248, 244, 239, .78);
            color: var(--flow-accent-strong);
            border: 1px solid color-mix(in srgb, var(--flow-accent-strong) 18%, white);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .05em;
            text-transform: uppercase;
            text-align: center;
            min-width: 124px;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .progress-track {
            width: 100%;
            height: 11px;
            border-radius: 999px;
            background: rgba(243, 239, 233, .82);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 10%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--amena-house) 0%, var(--flow-accent) 78%, color-mix(in srgb, var(--flow-accent) 70%, white) 100%);
            background-size: 180% 100%;
            animation: progressGlow 2.4s linear infinite;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset;
            transition: width 380ms cubic-bezier(.2, .8, .2, 1);
        }

        .screen {
            padding: 20px 20px 30px;
            min-height: calc(100vh - 96px);
            animation: fadeUp .28s ease-out;
        }

        .back-row {
            margin-top: 2px;
            margin-bottom: 14px;
            min-height: 24px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 0;
            background: transparent;
            color: #657085;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 6px 0;
            cursor: pointer;
            transition: color var(--transition), transform var(--transition);
        }

        .back-button:hover,
        .back-button:focus-visible {
            color: var(--amena-navy);
            outline: none;
            transform: translateX(-2px);
        }

        .headline {
            margin: 0 0 6px;
            color: var(--amena-navy);
            font-size: clamp(2rem, 5vw, 2.35rem);
            line-height: 1.08;
            letter-spacing: -0.04em;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .subheadline {
            margin: 0 0 20px;
            color: var(--amena-text);
            font-size: 18px;
            line-height: 1.33;
            overflow-wrap: anywhere;
        }

        .stack {
            display: grid;
            gap: 16px;
        }

        .stack-sm {
            display: grid;
            gap: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .grid-1 {
            display: grid;
            gap: 14px;
        }

        .selection-shell {
            display: grid;
            gap: 14px;
            padding: 16px;
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, color-mix(in srgb, var(--flow-accent-soft) 88%, white) 0%, rgba(255, 255, 255, .97) 100%);
            border: 1px solid color-mix(in srgb, var(--flow-accent-strong) 18%, white);
            box-shadow: var(--shadow-soft);
        }

        .section-kicker {
            margin: 0;
            color: var(--amena-navy);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .tower-button {
            width: 100%;
            padding: 0;
            background: transparent;
            text-align: left;
            border: 0;
        }

        .tower-lines {
            display: grid;
            gap: 4px;
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, .99) 0%, color-mix(in srgb, var(--flow-accent-soft) 44%, white) 100%);
            border: 1.5px solid color-mix(in srgb, var(--flow-accent-strong) 16%, white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            transition:
                transform var(--transition),
                box-shadow var(--transition),
                border-color var(--transition),
                background-color var(--transition);
            position: relative;
            min-width: 0;
        }

        .card.interactive {
            cursor: pointer;
            overflow: hidden;
        }

        .card.interactive::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(23, 63, 122, .00), rgba(23, 63, 122, .02));
            opacity: 0;
            transition: opacity var(--transition);
            pointer-events: none;
        }

        .card.interactive:hover,
        .card.interactive:focus-visible {
            border-color: var(--flow-accent-strong);
            transform: translateY(-3px);
            box-shadow: 0 24px 42px rgba(52, 63, 79, 0.14);
            outline: none;
        }

        .card.interactive:hover::after,
        .card.interactive:focus-visible::after {
            opacity: 1;
        }

        .card.interactive:active {
            transform: scale(.992);
            box-shadow: var(--shadow-press);
        }

        .card.selected {
            border-color: var(--amena-navy);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--amena-navy) 18%, transparent), 0 18px 38px rgba(52, 63, 79, .12);
            background: linear-gradient(180deg, #ffffff 0%, var(--flow-accent-soft) 100%);
            animation: selectedPulse .42s ease-out;
        }

        .card-body {
            padding: 18px 18px 16px;
        }

        .card-title {
            margin: 0 0 6px;
            color: var(--amena-navy);
            font-size: 20px;
            line-height: 1.16;
            letter-spacing: -0.02em;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .card-text,
        .card-subtext,
        .summary-line,
        .muted-note,
        .helper,
        .bullet-list li,
        .subsector-models li {
            overflow-wrap: anywhere;
            word-break: normal;
        }

        .card-text {
            margin: 0;
            color: var(--amena-text);
            font-size: 15px;
            line-height: 1.35;
        }

        .card-subtext {
            margin: 0;
            color: var(--amena-muted);
            font-size: 13px;
            line-height: 1.3;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .02em;
            white-space: normal;
            text-align: center;
            line-height: 1.15;
            max-width: 100%;
        }

        .badge.info {
            background: rgba(35, 79, 102, .10);
            color: var(--amena-navy);
        }

        .badge.success {
            background: var(--amena-success);
            color: white;
        }

        .badge.warning {
            background: var(--amena-warning);
            color: white;
        }

        .summary-box {
            padding: 16px 18px;
            border-radius: var(--radius-md);
            background: linear-gradient(180deg, color-mix(in srgb, var(--flow-accent-soft) 82%, white) 0%, rgba(255, 255, 255, .97) 100%);
            border: 1.5px solid color-mix(in srgb, var(--flow-accent-strong) 18%, white);
            color: var(--amena-navy);
            font-size: 16px;
            line-height: 1.45;
            font-weight: 900;
            box-shadow: var(--shadow-soft);
        }

        .summary-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 4px;
            align-items: center;
        }

        .summary-wrap .dot {
            color: #92a2b8;
            font-weight: 700;
        }

        .helper {
            margin: 0;
            color: var(--amena-muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .inline-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
            border: 1.5px solid color-mix(in srgb, var(--flow-accent-strong) 18%, white);
            background: linear-gradient(180deg, color-mix(in srgb, var(--flow-accent-soft) 76%, white) 0%, #fbfaf7 100%);
            color: var(--amena-navy);
            border-radius: var(--radius-md);
            padding: 17px 18px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            text-align: left;
            transition: background-color var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition);
            box-shadow: var(--shadow-soft);
        }

        .inline-link:hover,
        .inline-link:focus-visible {
            background: #fbfdff;
            border-color: var(--flow-accent-strong);
            outline: none;
            transform: translateY(-1px);
        }

        .inline-link span:last-child {
            color: color-mix(in srgb, var(--flow-accent-strong) 70%, #5d687a);
            white-space: nowrap;
            margin-left: 16px;
        }

        .actions {
            display: grid;
            gap: 14px;
            margin-top: 8px;
        }

        .btn {
            appearance: none;
            width: 100%;
            border-radius: 22px;
            border: 0;
            min-height: 72px;
            padding: 18px 20px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: .02em;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), background-color var(--transition), border-color var(--transition), color var(--transition);
            overflow-wrap: anywhere;
            box-shadow: 0 12px 28px rgba(24, 48, 94, 0.14);
        }

        .btn:active {
            transform: scale(.992);
        }

        .btn-primary {
            background: linear-gradient(180deg, var(--flow-button) 0%, color-mix(in srgb, var(--flow-button) 82%, black) 100%);
            color: white;
            animation: buttonBreathe 2.8s ease-in-out infinite;
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            background: linear-gradient(180deg, var(--flow-button-hover) 0%, color-mix(in srgb, var(--flow-button-hover) 80%, black) 100%);
            box-shadow: 0 18px 32px var(--flow-button-shadow);
            transform: translateY(-1px);
            outline: none;
        }

        .btn-secondary {
            background: linear-gradient(180deg, rgba(255, 255, 255, .97) 0%, color-mix(in srgb, var(--flow-accent-soft) 72%, white) 100%);
            color: var(--amena-navy);
            border: 1.5px solid color-mix(in srgb, var(--flow-accent-strong) 20%, white);
            box-shadow: var(--shadow-soft);
        }

        .btn-secondary:hover,
        .btn-secondary:focus-visible {
            border-color: color-mix(in srgb, var(--flow-accent-strong) 44%, white);
            background: color-mix(in srgb, var(--flow-accent-soft) 28%, white);
            outline: none;
            transform: translateY(-1px);
        }

        .btn-accent {
            background: linear-gradient(180deg, #d8862e 0%, #c97824 100%);
            color: white;
        }

        .btn-accent:hover,
        .btn-accent:focus-visible {
            background: linear-gradient(180deg, #df8f39 0%, #cf7c28 100%);
            outline: none;
        }

        .field-group {
            display: grid;
            gap: 8px;
        }

        .field-label {
            color: var(--amena-navy);
            font-size: 14px;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .field-control,
        .field-select {
            width: 100%;
            border: 1.5px solid var(--amena-border);
            border-radius: var(--radius-md);
            padding: 18px 16px;
            min-height: 66px;
            background: white;
            color: var(--amena-text);
            font-size: 17px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            box-shadow: var(--shadow-soft);
        }

        .field-control:focus,
        .field-select:focus {
            border-color: var(--flow-accent-strong);
            box-shadow: 0 0 0 4px rgba(44, 95, 177, .10), var(--shadow-soft);
        }

        .check-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            padding: 18px 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--amena-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(246, 241, 233, .99));
            box-shadow: var(--shadow-soft);
        }

        .check-row input {
            width: 22px;
            height: 22px;
            accent-color: var(--amena-navy);
            margin-top: 1px;
            flex: 0 0 auto;
        }

        .hero-card {
            padding: 18px;
            border-radius: 28px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--flow-accent-soft) 78%, white) 0%, rgba(255, 255, 255, .96) 100%);
            border: 1.5px solid color-mix(in srgb, var(--flow-accent-strong) 20%, white);
            box-shadow: var(--shadow-soft);
        }

        .bullet-list {
            display: grid;
            gap: 8px;
            margin: 12px 0 0;
            padding-left: 22px;
            color: var(--amena-text);
            font-size: 15px;
            line-height: 1.45;
        }

        .subsector-models {
            display: grid;
            gap: 8px;
            margin: 8px 0 0;
            padding-left: 18px;
            color: var(--amena-text);
            font-size: 13px;
            line-height: 1.35;
        }

        .status-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-meta {
            display: grid;
            gap: 4px;
        }

        .cta-text {
            font-size: 18px;
            line-height: 1.3;
            font-weight: 900;
            color: var(--amena-navy);
            margin: 0 0 8px;
            overflow-wrap: anywhere;
        }

        .centered {
            text-align: center;
        }

        .foot-link {
            margin-top: 24px;
            text-align: center;
        }

        .foot-link button,
        .foot-link a {
            border: 0;
            background: transparent;
            color: var(--amena-navy);
            font-size: 14px;
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 5px;
            cursor: pointer;
        }

        .note-box {
            padding: 14px 16px;
            background: rgba(255, 255, 255, .68);
            border: 1px dashed #c6ceda;
            border-radius: 18px;
            color: var(--amena-muted);
            font-size: 13px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 32, 55, 0.46);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;

        }

        .modal-top {

            gap: 16px;
            margin-bottom: 12px;
        }

            line-height: 1.1;
            font-weight: 900;
            overflow-wrap: anywhere;
        }

        .icon-close {
            border: 0;
            background: #f1f5fb;
            color: var(--amena-navy);
            width: 42px;
            height: 42px;
            border-radius: 999px;
            font-size: 20px;
            cursor: pointer;
            flex: 0 0 auto;
            transition: transform var(--transition), background-color var(--transition);
        }

        .icon-close:hover,
        .icon-close:focus-visible {
            background: #e6eefb;
            transform: rotate(90deg);
            outline: none;
        }

        .modal-placeholder {
            display: grid;
            gap: 12px;
            margin-top: 10px;
        }

        .placeholder-visual {
            min-height: 180px;
            border-radius: 22px;
            border: 1.5px dashed #c4cfdf;
            background:
                linear-gradient(135deg, rgba(23, 63, 122, .06), rgba(215, 134, 42, .04)),

            display: grid;
            place-items: center;
            padding: 20px;
            color: var(--amena-navy);
            font-weight: 800;
            text-align: center;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        .card.disabled {
            opacity: .68;
            cursor: not-allowed;
            box-shadow: none;
            background: linear-gradient(180deg, #fbfbfa 0%, #f4f1ec 100%);
        }

        .card.disabled:hover {
            transform: none;
        }

        .unit-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 18px;
        }

        @keyframes selectedPulse {
            0% {
                transform: translateY(0) scale(.985);
            }

            100% {
                transform: translateY(0) scale(1);
            }
        }

        @keyframes buttonBreathe {

            0%,
            100% {
                box-shadow: 0 12px 28px var(--flow-button-shadow);
            }

            50% {
                box-shadow: 0 18px 34px var(--flow-button-shadow);
            }
        }

        @keyframes progressGlow {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        @media (max-width: 390px) {

            .screen,
            .topbar {
                padding-left: 16px;
                padding-right: 16px;
            }

                gap: 12px;

            }

                font-size: 11px;
            }

            .btn {
                min-height: 66px;
            }
        }

</head>

            stepChip.textContent = `PASO ${current} DE ${total}`;
            progressFill.style.width = `${(current / total) * 100}%`;
        }

        function goToStep(index) {
            const steps = getFlowSteps();
            state.stepIndex = Math.max(0, Math.min(index, steps.length - 1));
            saveState();
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleBack() {
            if (state.stepIndex === 0) {
                if (window.history.length > 1) {
                    window.history.back();
                }
                return;
            }
            goToStep(state.stepIndex - 1);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function formatTime24to12(timeStr) {
            if (!timeStr) return '';
            const [h, mm] = timeStr.split(':').map(Number);
            const suffix = h >= 12 ? 'p. m.' : 'a. m.';
            const normalized = h % 12 || 12;
            return `${normalized}:${String(mm).padStart(2, '0')} ${suffix}`;
        }

            return status === 'Disponible' ? 'success' : 'warning';

        }

            if (state.towerId) parts.push(`Torre: ${state.towerId}`);
            if (state.apartmentModelName) parts.push(`Modelo: ${state.apartmentModelName}`);

          <div class="summary-wrap">

        function computeTowerModelSummary(tower) {
            const modelNames = Object.keys(tower.models);
            return modelNames.map(name => {
                let available = 0;
                let reserved = 0;
                const levels = tower.models[name].levels;
                Object.values(levels).forEach(list => list.forEach(item => {
                    if (item.status === 'Disponible') available += 1;
                    if (item.status === 'Pre reservada') reserved += 1;
                }));
                return `${name}: ${available} disponibles · ${reserved} pre reserva`;
            });
        }

        function computeTowerBadge(tower) {
            let available = 0;
            let reserved = 0;
            Object.values(tower.models).forEach(model => {
                Object.values(model.levels).forEach(levels => levels.forEach(item => {
                    if (item.status === 'Disponible') available += 1;
                    if (item.status === 'Pre reservada') reserved += 1;
                }));
            });
            return available > 0 ? { text: 'Disponibles', kind: 'success' } : { text: 'Pre reserva', kind: 'warning' };

              <button type="button" class="btn btn-primary" onclick="goToStep(8)">CONFIRMAR PRE RESERVA</button>
              <button type="button" class="btn btn-secondary" onclick="goBackToLastSelection()">EDITAR SELECCIÓN</button>
            </div>
          </section>
        `;
            }
            const model = getSelectedHouseModel();
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Tu Pre Reserva</h1>
            <p class="subheadline">Revisa cuidadosamente la información de la unidad seleccionada antes de confirmar tu pre reserva.</p>
          </div>
          ${renderSummaryBox(getHouseSummaryText())}
          <div class="card">
            <div class="card-body">
              <h3 class="card-title">Detalles de tu unidad seleccionada</h3>
              <ul class="bullet-list">
                <li>Tipo de vivienda: Casa</li>
                <li>Sector: ${state.sectorId}</li>
                <li>Sub sector: ${state.subSectorId}</li>
                <li>Modelo: ${state.houseModelName}</li>
                <li>Unidad: ${state.houseUnit}</li>
                <li>Área: ${model?.area || '--'}</li>
                <li>Precio referencial: ${model?.price || '--'}</li>
                <li>Estado actual: ${state.reservationStatus}</li>
                <li>Vigencia estimada de la pre reserva: ${state.reservationValidity}</li>
              </ul>
              <p class="helper" style="margin-top:10px;color:var(--amena-blue);font-weight:800;">Vas muy bien. Revisa con seguridad cada detalle antes de confirmar tu pre reserva.</p>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="goToStep(7)">CONFIRMAR PRE RESERVA</button>
            <button type="button" class="btn btn-secondary" onclick="goBackToLastSelection()">EDITAR SELECCIÓN</button>
          </div>
        </section>
      `;
        }

        function goBackToLastSelection() {
            if (state.flow === 'apartments') goToStep(6);
            else goToStep(5);
        }

        function renderPreReserveConfirmation() {
            const summary = state.flow === 'apartments'
                ? `Apartamento reservado: ${state.apartmentUnit}`
                : `Casa reservada: ${state.houseUnit}`;
            const lines = state.flow === 'apartments'
                ? [`Sector: ${state.sectorId}`, `Torre: ${state.towerId}`, `Modelo: ${state.apartmentModelName}`, `Nivel: ${state.levelId}`, `Vigencia estimada: ${state.reservationValidity} calendario`]
                : [`Sector: ${state.sectorId}`, `Sub sector: ${state.subSectorId}`, `Modelo: ${state.houseModelName}`, `Vigencia estimada: ${state.reservationValidity} calendario`];
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Confirmación de pre reserva</h1>
            <p class="subheadline">Tu solicitud ya fue registrada. Ahora puedes continuar con los siguientes pasos de acompañamiento.</p>
          </div>
          ${renderSummaryBox(state.flow === 'apartments' ? getApartmentSummaryText() : getHouseSummaryText())}
          <div class="card">
            <div class="card-body">
              <h3 class="card-title">Tu pre reserva ha sido registrada</h3>
              <ul class="bullet-list">
                <li>${summary}</li>
                ${lines.map(item => `<li>${item}</li>`).join('')}
              </ul>
              <p class="helper" style="margin-top:10px;color:var(--amena-blue);font-weight:800;">Continúa al siguiente paso para elegir cómo deseas avanzar con AMENA.</p>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="goToStep(${state.flow === 'apartments' ? 9 : 8})">CONTINUAR</button>
          </div>
        </section>
      `;
        }

        function renderCTASelection() {
            const ctas = [
                'Conversa con nuestro agente digital dentro de esta página, por texto o voz, podrás aclarar cualquier duda, de cualquier índole que sea.',
                'Agenda recibir una llamada de nuestro agente digital a tu teléfono móvil en el día y hora de tu preferencia.',
                'Agenda una cita al proyecto o a nuestra oficina de ventas en el momento disponible que mejor te convenga.'
            ];
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Tu siguiente paso con AMENA</h1>
            <p class="subheadline">Ya registramos tu pre reserva. Ahora elige cómo deseas continuar para recibir atención y acompañamiento.</p>
          </div>
          <div class="grid-1">
            ${ctas.map((text, index) => `
              <div class="card interactive ${state.selectedCTA === String(index + 1) ? 'selected' : ''}" onclick="selectCTA('${index + 1}')">
                <div class="card-body">
                  <p class="cta-text">${text}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
        }

        function selectCTA(ctaId) {
            state.selectedCTA = ctaId;
            saveState();
            if (ctaId === '1') goToStep(state.flow === 'apartments' ? 10 : 9);
            if (ctaId === '2') goToStep(state.flow === 'apartments' ? 11 : 10);
            if (ctaId === '3') goToStep(state.flow === 'apartments' ? 12 : 11);
        }

        function reservationSummaryForCTA() {
            if (state.flow === 'apartments') {
                return `Pre reserva registrada · Apartamento ${state.apartmentUnit} · Torre ${state.towerId}`;
            }
            return `Pre reserva registrada · Casa ${state.houseUnit} · Sub sector ${state.subSectorId}`;
        }

        function renderCTAConversation() {
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Conversa con nuestro agente digital</h1>
            <p class="subheadline">Por texto o voz, podrás aclarar cualquier duda, de cualquier índole que sea.</p>
          </div>
          ${renderSummaryBox([reservationSummaryForCTA()])}
          <div class="card">
            <div class="card-body">
              <p class="card-text">Ya registramos tu pre reserva. Ahora puedes iniciar una conversación por texto o voz para aclarar cualquier duda y seguir avanzando dentro de esta misma página.</p>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="alert('Aquí se integrará el widget del agente digital por texto o voz.');">INICIAR CONVERSACIÓN POR TEXTO O VOZ</button>
          </div>
        </section>
      `;
        }

        function renderCTACall() {
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Agenda recibir una llamada de nuestro agente digital</h1>
            <p class="subheadline">A tu teléfono móvil en el día y hora de tu preferencia.</p>
          </div>
          ${renderSummaryBox([reservationSummaryForCTA()])}
          <div class="stack-sm">
            <label class="field-group">
              <span class="field-label">Número de teléfono móvil</span>
              <input class="field-control" type="tel" value="${state.callPhone}" oninput="state.callPhone = this.value; saveState();" />
            </label>
            <label class="field-group">
              <span class="field-label">Fecha deseada</span>
              <input class="field-control" type="date" value="${state.callDate}" oninput="state.callDate = this.value; saveState();" />
            </label>
            <label class="field-group">
              <span class="field-label">Hora deseada</span>
              <input class="field-control" type="time" value="${state.callTime}" oninput="state.callTime = this.value; saveState();" />
            </label>
          </div>
          <p class="helper">Recibirás la llamada en el número que registres. Si necesitas cambiar la fecha u hora después, podrás hacerlo escribiendo al WhatsApp de AMENA.</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="completeFlow('llamada')">CONFIRMAR LLAMADA</button>
          </div>
        </section>
      `;
        }

        function renderCTAVisit() {
            const projectSelected = state.visitType === 'proyecto';
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Agenda una cita al proyecto o a nuestra oficina de ventas</h1>
            <p class="subheadline">En el momento disponible que mejor te convenga.</p>
          </div>
          ${renderSummaryBox([reservationSummaryForCTA()])}
          <div class="grid-1">
            <div class="card interactive ${projectSelected ? 'selected' : ''}" onclick="state.visitType='proyecto'; saveState(); render();">
              <div class="card-body">
                <h3 class="card-title">Visita al proyecto de construcción</h3>
                <p class="card-text">Vendedor asignado: ${mockData.seller.name} · Horarios disponibles</p>
              </div>
            </div>
            <div class="card interactive ${!projectSelected ? 'selected' : ''}" onclick="state.visitType='oficina'; saveState(); render();">
              <div class="card-body">
                <h3 class="card-title">Cita en oficina de ventas de San Salvador</h3>
                <p class="card-text">Horarios disponibles en oficina</p>
              </div>
            </div>
          </div>
          <div class="grid-2">
            <label class="field-group">
              <span class="field-label">Fecha seleccionada</span>
              <input class="field-control" type="date" value="${state.visitDate}" oninput="state.visitDate = this.value; saveState();" />
            </label>
            <label class="field-group">
              <span class="field-label">Hora seleccionada</span>
              <input class="field-control" type="time" value="${state.visitTime}" oninput="state.visitTime = this.value; saveState();" />
            </label>
          </div>
          <p class="helper">Recibirás un mensaje de WhatsApp confirmando que tu cita ha sido recibida y ya está asegurada. También recibirás otro mensaje 24 horas antes como recordatorio.</p>
          <p class="helper">Si deseas suspender o reprogramar tu cita, escribe al WhatsApp de AMENA: ${mockData.seller.whatsapp}. Un agente digital te ayudará a realizar el cambio solicitado.</p>
          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="completeFlow('cita')">CONFIRMAR CITA</button>
          </div>
        </section>
      `;
        }

        function completeFlow(kind) {
            state.finalAction = kind;
            saveState();
            goToStep(getFlowSteps().length - 1);
        }

        function renderFinalConfirmation() {
            const actionLabel = state.finalAction === 'cita'
                ? 'Cita presencial registrada'
                : state.finalAction === 'llamada'
                    ? 'Llamada agendada correctamente'
                    : 'Conversación digital registrada';
            const summary = state.flow === 'apartments'
                ? ['Tipo: Apartamentos', `Sector: ${state.sectorId}`, `Torre: ${state.towerId}`, `Modelo: ${state.apartmentModelName}`, `Nivel: ${state.levelId}`, `Unidad: ${state.apartmentUnit}`, `Acción: ${actionLabel}`]
                : ['Tipo: Casas', `Sector: ${state.sectorId}`, `Sub sector: ${state.subSectorId}`, `Modelo: ${state.houseModelName}`, `Unidad: ${state.houseUnit}`, `Acción: ${actionLabel}`];
            return `
        ${renderBackButton()}
        <section class="stack">
          <div class="stack-sm">
            <h1 class="headline">Proceso finalizado correctamente</h1>
            <p class="subheadline">Tu información ha sido registrada exitosamente. Gracias por avanzar en este recorrido con AMENA.</p>
          </div>
          ${renderSummaryBox(summary)}
          <div class="card">
            <div class="card-body">
              <h3 class="card-title">Resumen final</h3>
              <ul class="bullet-list">
                <li>La pre reserva ha quedado registrada en el sistema.</li>
                <li>La acción comercial seleccionada ha sido registrada correctamente.</li>
                <li>Un miembro del equipo de AMENA continuará el acompañamiento correspondiente.</li>
                <li>Gracias por tu interés en AMENA.</li>
              </ul>
            </div>
          </div>
        </section>
      `;
        }

        function goToReview() {
            goToStep(state.flow === 'apartments' ? 7 : 6);
        }

        function resetJourney() {
            state = structuredClone(defaultState);
            saveState();
            render();
        }

        function renderCurrentScreen() {
            const stepKey = getCurrentStep().key;
            if (stepKey === 'welcome') return renderWelcome();
            if (stepKey === 'housingType') return renderHousingType();
            if (state.flow === 'apartments') {
                if (stepKey === 'sector') return renderApartmentSector();
                if (stepKey === 'tower') return renderApartmentTower();
                if (stepKey === 'apartmentModel') return renderApartmentModel();
                if (stepKey === 'level') return renderApartmentLevel();
                if (stepKey === 'apartment') return renderApartmentSelection();
            } else {
                if (stepKey === 'sector') return renderHouseSector();
                if (stepKey === 'subsector') return renderHouseSubsector();
                if (stepKey === 'houseModel') return renderHouseModel();
                if (stepKey === 'house') return renderHouseSelection();
            }
            if (stepKey === 'review') return renderReview();
            if (stepKey === 'preReserveConfirmation') return renderPreReserveConfirmation();
            if (stepKey === 'ctaSelection') return renderCTASelection();
            if (stepKey === 'ctaConversation') return renderCTAConversation();
            if (stepKey === 'ctaCall') return renderCTACall();
            if (stepKey === 'ctaVisit') return renderCTAVisit();
            if (stepKey === 'finalConfirmation') return renderFinalConfirmation();
            return `<section class="stack"><h1 class="headline">Pantalla en construcción</h1></section>`;
        }

        function render() {
            updateHeader();
            document.body.classList.remove('theme-apartments', 'theme-houses');
            document.body.classList.add(state.flow === 'houses' ? 'theme-houses' : 'theme-apartments');
            app.innerHTML = renderCurrentScreen();
        }

        function openModal(type) {
            const payload = modalContent[type] || { title: 'Información', body: '<p class="helper">Contenido pendiente de carga.</p>' };
            document.getElementById('modalTitle').textContent = payload.title;
            document.getElementById('modalBody').innerHTML = payload.body;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        document.getElementById('modalOverlay').addEventListener('click', closeModal);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        render();

        window.handleBack = handleBack;
        window.goToStep = goToStep;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.startJourney = startJourney;
        window.setFlow = setFlow;
        window.selectApartmentSector = selectApartmentSector;
        window.selectTower = selectTower;
        window.selectApartmentModel = selectApartmentModel;
        window.selectApartmentLevel = selectApartmentLevel;
        window.selectApartmentUnit = selectApartmentUnit;
        window.selectHouseSector = selectHouseSector;
        window.selectSubsector = selectSubsector;
        window.selectHouseModel = selectHouseModel;
        window.selectHouseUnit = selectHouseUnit;
        window.goBackToLastSelection = goBackToLastSelection;
        window.selectCTA = selectCTA;
        window.completeFlow = completeFlow;
        window.goToReview = goToReview;
        window.resetJourney = resetJourney;
        window.state = state;
        window.saveState = saveState;
    </script>
</body>

</html>
